extends: configs/base.yaml

scheduler_tick_sec: 2
default_mode: NORMAL
score_window_size: 6

weights:
  density: 0.35
  activity: 0.20
  anomaly: 0.25
  queue_pressure: 0.20

scoring:
  density_reference: 25
  activity_reference_fps: 12
  anomaly_detection_reference: 12
  anomaly_latency_ms: 150
  queue_buffer_reference: 1.0
  queue_drop_rate_reference: 0.20
  latency_target_ms: 80

modes:
  ECO:
    input_size: 640
    sampling_fps: 3
    model_variant: light
    cloud_review: false
  NORMAL:
    input_size: 960
    sampling_fps: 6
    model_variant: main
    cloud_review: false
  ALERT:
    input_size: 1280
    sampling_fps: 10
    model_variant: enhanced
    cloud_review: true

thresholds:
  eco_max: 0.35
  normal_max: 0.70

# Optional detector config overrides applied by model_variant.
# Keep model_name untouched by default to avoid additional weight downloads.
detector_overrides:
  light:
    infer:
      imgsz: 640
  main:
    infer:
      imgsz: 960
  enhanced:
    infer:
      imgsz: 1280
