extends: configs/base.yaml

detector:
  variant: enhanced
  task: detect
  model_name: yolov8s.pt
  model_path: null
  device: cuda
  class_names:
    0: head
  infer:
    conf_threshold: 0.25
    iou_threshold: 0.45
    imgsz: 960
    max_det: 300
  train:
    data: data/annotations/head_dataset.yaml
    epochs: 120
    imgsz: 960
    batch: 8
    workers: 4
    patience: 50
    pretrained: true
    exist_ok: true
    run_name: yolov12_p2_head
